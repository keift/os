name: Build

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

env:
  VERSION: 1
  FEDORA_VERSION: 44

jobs:
  image:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ env.VERSION }}
          push: true
          file: ./Containerfile
          context: ./
          platforms: linux/amd64,linux/arm64

  iso:
    # needs: image

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create dist directory
        run: mkdir -p ./dist

      - name: Pull image
        run: sudo podman pull ghcr.io/${{ github.repository }}:latest

      - name: Build it
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest

      - name: Move to dist directory
        run: mv ${{ steps.build.outputs.iso-dest }} ./dist/keift-os-${{ matrix.arch }}.iso

      - name: Generate checksum file
        run: sha256sum ./dist/keift-os-${{ matrix.arch }}.iso > ./dist/keift-os-${{ matrix.arch }}.iso-CHECKSUM

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com s3://${{ secrets.R2_BUCKET_NAME }} --recursive 
          aws s3 cp --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com ./dist/keift-os-${{ matrix.arch }}.iso s3://${{ secrets.R2_BUCKET_NAME }}/keift-os-${{ matrix.arch }}.iso

      - name: Update release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            ./dist/keift-os-${{ matrix.arch }}.iso
            ./dist/keift-os-${{ matrix.arch }}.iso-CHECKSUM
