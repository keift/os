name: Build

on:
  release:
    types: [created]

  schedule:
    - cron: '0 0 * * *'

permissions:
  packages: write

env:
  VERSION: 1

jobs:
  image:
    # if: github.event.release.target_commitish == 'main' || github.event_name == 'schedule'
    if: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          tags: ghcr.io/${{ github.repository }},ghcr.io/${{ github.repository }}:beta
          push: true
          file: ./Containerfile
          context: ./
          platforms: linux/amd64,linux/arm64

  iso:
    # needs: image

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pull image
        run: sudo podman pull ghcr.io/${{ github.repository }}

      - name: Build it
        run: |
          mkdir -p ./dist

          tee ./dist/config.toml &>/dev/null << EOF
          [customizations.installer.kickstart]
          contents = """
          graphical
          rootpw --lock
          """

          [customizations.iso]
          volume_id = "KEIFT-OS"
          EOF

          sudo podman run \
            --rm \
            --privileged \
            -v ./dist/config.toml:/config.toml \
            -v ./dist:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder \
            --type anaconda-iso \
            --rootfs ext4 \
            ghcr.io/${{ github.repository }}

          rm -rf ./dist/config.toml

          sudo chown -R $USER:$USER ./dist

      - name: Prepare for injection
        run: |
          mkdir -p ./dist/inject

          cp -r ./src ./dist/inject

      - name: Inject it
        run: |
          sudo apt install -y cpio squashfs-tools xorriso

          sudo chown -R root:root ./dist/inject

          mkdir -p ./dist/images

          cd ./dist/inject
          sudo bash -c "find ./ -mindepth 1 | cpio -H newc -o > ../images/product.img"
          cd ../../

          sudo rm -rf ./dist/inject

          mkdir -p ./dist/update

          sudo xorriso \
            -indev ./dist/bootiso/install.iso \
            -osirrox on \
            -extract /EFI/BOOT/grub.cfg ./dist/update/grub.cfg

          sudo xorriso \
            -indev ./dist/bootiso/install.iso \
            -osirrox on \
            -extract /.buildstamp ./dist/update/.buildstamp

          sudo chown -R $USER:$USER ./dist/update

          sed -i "s/Keift OS 44/Keift OS 1 Mabolla/g" ./dist/update/grub.cfg
          sed -i "s/^Version = .*/Version = 1 Mabolla/" ./dist/update/.buildstamp

          sudo xorriso \
            -indev ./dist/bootiso/install.iso \
            -outdev ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso \
            -map ./dist/images/product.img /images/product.img \
            -update ./dist/update/grub.cfg /EFI/BOOT/grub.cfg \
            -update ./dist/update/.buildstamp /.buildstamp \
            -boot_image any replay

          sudo rm -rf ./dist/bootiso
          sudo rm -rf ./dist/images
          sudo rm -rf ./dist/update

          sudo chown -R $USER:$USER ./dist

      - name: Generate checksum file
        run: sha256sum ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso | cut -f 1 -d " " > ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso-CHECKSUM

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso \
            s3://${{ secrets.R2_BUCKET_NAME }}/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso

          aws s3 cp \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso-CHECKSUM \
            s3://${{ secrets.R2_BUCKET_NAME }}/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso-CHECKSUM
