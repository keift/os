name: Build

on:
  release:
    types: [created]

  schedule:
    - cron: '0 0 * * *'

permissions:
  packages: write

env:
  VERSION: 1

jobs:
  image:
    if: github.event.release.target_commitish == 'main' || github.event_name == 'schedule'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          tags: ghcr.io/${{ github.repository }},ghcr.io/${{ github.repository }}:beta
          push: true
          file: ./Containerfile
          context: ./
          platforms: linux/amd64,linux/arm64

  iso:
    needs: image

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pull image
        run: sudo podman pull ghcr.io/${{ github.repository }}

      - name: Build it
        run: |
          mkdir -p ./dist/build

          tee ./dist/build/config.toml &>/dev/null << EOF
          [customizations.installer.kickstart]
          contents = """
          graphical
          rootpw --lock
          """

          [customizations.iso]
          volume_id = "KEIFT-OS"
          EOF

          mkdir -p ./dist/build/output

          sudo podman run \
            --rm \
            --privileged \
            -v ./dist/build/config.toml:/config.toml:ro \
            -v ./dist/build/output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder \
            --type anaconda-iso \
            ghcr.io/${{ github.repository }}

      - name: Prepare for injection
        run: |
          sudo apt install -y cpio xorriso

          mkdir -p ./dist/inject

          cp -r ./src/etc ./dist/inject/etc
          cp -r ./src/usr ./dist/inject/usr

          sudo chown -R root:root ./dist/inject

      - name: Inject it
        run: |
          mkdir -p ./dist/images

          cd ./dist/inject
          sudo bash -c "find ./ -mindepth 1 | cpio -H newc -o > ../images/product.img"
          cd ../../

          sudo rm -rf ./dist/inject

      - name: Merge the changes
        run: |
          sudo xorriso \
            -indev ./dist/build/output/bootiso/install.iso \
            -outdev ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso \
            -map ./dist/images/product.img /images/product.img \
            -boot_image any replay

          sudo rm -rf ./dist/build
          sudo rm -rf ./dist/images

          sudo chown -R $USER:$USER ./dist

      - name: Generate checksum file
        run: sha256sum ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso | cut -f 1 -d " " > ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso-CHECKSUM

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso \
            s3://${{ secrets.R2_BUCKET_NAME }}/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso

          aws s3 cp \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            ./dist/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso-CHECKSUM \
            s3://${{ secrets.R2_BUCKET_NAME }}/keift-os-${{ env.VERSION }}-${{ matrix.arch }}.iso-CHECKSUM
