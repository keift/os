name: Build

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

env:
  FEDORA_VERSION: 44

jobs:
  image:
    if: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          tags: ghcr.io/${{ github.repository }}:latest
          push: true
          file: ./Containerfile
          context: ./
          platforms: linux/amd64,linux/arm64

  iso:
    # needs: image

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create dist directory
        run: mkdir -p ./dist

      - name: Download Fedora Everything
        run: wget -O ./dist/fedora.iso https://download.fedoraproject.org/pub/fedora/linux/releases/${{ env.FEDORA_VERSION }}/Everything/${{ matrix.arch }}/iso/Fedora-Everything-netinst-${{ matrix.arch }}-44-1.7.iso

      - name: Create kickstart file
        run: |
          tee ./dist/custom.ks &>/dev/null << EOF
          graphical

          network --activate --bootproto=dhcp --device=link

          ostreecontainer --no-signature-verification --transport registry --url ghcr.io/${{ github.repository }}:latest

          reboot
          EOF

      - name: Build it
        run: |
          sudo podman run \
            --rm \
            -v ${{ github.workspace }}/dist:/work \
            -w /work \
            fedora:${{ env.FEDORA_VERSION }} \
            /bin/bash -c "dnf install -y lorax && mkksiso --ks custom.ks ./fedora.iso ./keift-os-${{ matrix.arch }}.iso"

      - name: Generate checksum file
        run: sha256sum ./dist/keift-os-${{ matrix.arch }}.iso > ./keift-os-${{ matrix.arch }}.iso-CHECKSUM

      - name: Update release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            ./dist/keift-os-${{ matrix.arch }}.iso
            ./dist/keift-os-${{ matrix.arch }}.iso-CHECKSUM
