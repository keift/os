label: keift-os

grub2:
  default: 0
  timeout: 10

  entries:
    - name: Keift OS Live
      linux: /images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=keift-os enforcing=0 rd.live.image
      initrd: /images/pxeboot/initrd.img

    - name: Keift OS Live (Basic Graphics)
      linux: /images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=keift-os enforcing=0 rd.live.image nomodeset
      initrd: /images/pxeboot/initrd.img
